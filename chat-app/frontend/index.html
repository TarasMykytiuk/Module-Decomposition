<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taras Mykytiuk Chat app</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <script defer src="frontend.js"></script>
</head>

<body>
    <div id="display_messages">
        <h1>Recent messages:</h1>
    </div>
    <div id="send_message">
        <h1>Send new message:</h1>
        <form id="form">
            <label for="message_user">Enter username:</label>
            <input id="message_user" name="message_user" required />
            <label for="message_text">Enter text:</label>
            <textarea id="message_text" name="message_text" required></textarea>
            <button id="send_button">Send</button>
        </form>
    </div>
</body>

</html>
